<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuesto Don Chelo</title>
    <link rel="stylesheet" href="../../public/css/pages/login.css">
</head>
<body>
    <main class="pantalla-principal">
        <header class="encabezado">
            <a href="">
                <img src="../../public/imagenes/Ícono de flecha izquierda circular.png"  alt="volver atras" width="50px">
            </a>
            <div>
                
                <h2>Iniciar sesion</h2>
                <p>¡Bienvenido de nuevo!</p>
            </div>
        </header>
        <section class="login">
            <form action="#">
                <label for="correo">Correo o telefono</label>
                <input type="email" id="correo" name="correo"  placeholder="usuario@gmail.com" autocomplete="email"  required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu Contraseña" autocomplete="current-password" required>

                <a href="#">¿Olvidaste tu Contraseña?</a>

                <button id="iniciar-sesion">Iniciar sesion</button>
            </form>
        </section>
        <section class="continuar_con">
            <div>
                <div class="barra-uno">

                </div>
                <p>o continua con</p>
                <div class="barra-dos">

                </div>
            </div>
        </section>
        <section class="opciones_login">
            <div>
                <div class="img-uno">
                    <a href="#">
                        <img src="../../public/imagenes/Logotipo colorido de Google en transparencia.png" alt="Logo de Google">
                    </a>
                </div>
                <div class="img-dos">
                    <a href="#">
                        <img src="../../public/imagenes/Logotipo azul de Facebook.png" alt="Logo de Facebook">
                    </a>
                </div>
            </div>
        </section>
        <section class="no_tengo_cuenta">
            <p>¿No tienes una cuenta? <a href="#">Registrate</a></p>
        </section>
    </main>
</body>
</html>
